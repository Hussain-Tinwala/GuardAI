services:
  # 1. The Node.js Express Backend
  - type: web
    name: guardai-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: USE_MOCK_API
        value: true

  # 2. The React/Vite Dashboard
  - type: web
    name: guardai-dashboard
    env: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # In production, we need the dashboard to know where the backend is
    envVars:
      - key: VITE_BACKEND_URL
        value: https://guardai-backend.onrender.com